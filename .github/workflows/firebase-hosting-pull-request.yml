name: Build
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Aviso temprano en las PR a main: el deploy fallará si la versión no ha subido
      - if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        working-directory: .
        run: node .github/scripts/check-version.mjs
      - run: npm ci
      - run: npm run build
      # After the build: sw.test.js and appUpdate.test.js also check client/build
      - run: npm test
